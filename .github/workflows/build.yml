name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Check and Fix Gradle Wrapper if Corrupt
      run: |
        if ./gradlew --version > /dev/null 2>&1; then
          echo "Gradle Wrapper aman, melanjutkan build..."
        else
          echo "Gradle Wrapper corrupt! Memperbaiki dan melakukan push ke repo..."
          rm -rf gradle/wrapper/gradle-wrapper.jar
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add gradle/wrapper/
          if ! git diff --staged --quiet; then
            git commit -m "fix: update official gradle wrapper [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
        fi

    - name: Setup Gradle Cache
      uses: gradle/actions/setup-gradle@v4
      with:
        validate-wrappers: false

    - name: Restore Keystore Files
      run: |
        if [ -f my-upload-key.jks.base64 ]; then
          base64 -d my-upload-key.jks.base64 > my-upload-key.jks
        fi

        if [ ! -f my-upload-key.jks ] || ! keytool -list -keystore my-upload-key.jks -storepass android > /dev/null 2>&1; then
          echo "my-upload-key.jks corrupt atau tidak valid. Membuat ulang..."
          rm -f my-upload-key.jks
          keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Upload,O=Android,C=US"
        fi

        if [ ! -f debug.keystore ]; then
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
        fi

        if [ -f .env.example ] && [ ! -f .env ]; then
          cp .env.example .env
        fi

    - name: Build Release APK
      run: ./gradlew :app:assembleRelease -x lint -x lintVitalRelease -x test --no-daemon --parallel --build-cache

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: release-apk
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: warn
